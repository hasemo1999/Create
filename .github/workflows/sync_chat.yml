name: Auto-sync Chat to 100倍まとめ

on:
  schedule:
    - cron: '0 15 * * *'        # 0:00 JST
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install openai==0.28.1 python-dotenv

      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/fetch_and_append.py
