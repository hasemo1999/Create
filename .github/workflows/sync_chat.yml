name: Auto-sync 100倍まとめ

on:
  # 手動実行
  workflow_dispatch:
  # 毎日 0:15 JST ＝ 15:15 UTC
  schedule:
    - cron: '15 15 * * *'
  # main ブランチに push された時
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ① リポジトリを取得
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Python 3.11 をセットアップ
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ③ 必要ライブラリをインストール
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install openai==0.28.1 python-dotenv pandas
          pip install openai==0.28.1 python-dotenv pandas

      # ④ チャット履歴を取得して Markdown に追記
      - name: Fetch & append chat
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/fetch_and_append.py \
            --thread $CHAT_THREAD_ID \
            --output docs/100倍まとめ.md

      # ⑤ 期待値ダッシュボードを生成（必要に応じて）
      - name: Build expectancy report
        run: |
          python scripts/build_expectancy.py

      # ⑥ 変更があればコミット & プッシュ
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # docs フォルダ下の .md をまとめてステージ
          git add docs/*.md

          # 差分がある時だけコミット
          git diff --cached --quiet || \
            git commit -m "chore: auto-sync chat $(date -u '+%Y-%m-%d')"

          git push

